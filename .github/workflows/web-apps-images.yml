# Owned by the web-apps stack (web-apps/). It lives here only because GitHub Actions
# reads workflows from the repository root's .github/workflows/ and nowhere else.
# Keep it thin: build/lint logic belongs in web-apps/ (Dockerfile, package.json
# scripts), so this file only triggers and wires it up.
# Extracting web-apps into its own repo: move this file to that repo's
# .github/workflows/ and drop the "web-apps/" prefixes (paths filters, lint
# working-directory, package_json_file, cache-dependency-path, image context).
# See web-apps/docs/architecture.md#extracting-this-stack.
#
# Builds the web-apps images (web-apps/Dockerfile, one per app) and pushes them to
# GitHub Container Registry. Self-hosted prod pulls them
# (web-apps/docker-compose-web-apps.prod.yml); Vercel deploys don't use them.
#
#   pull request -> lint + build only (checks the images still build; nothing pushed)
#   push to main -> lint + build + push  ghcr.io/<owner>/<repo>/<app>:sha-<7-char commit>  and  :latest
#   manual       -> Actions tab > "web-apps images" > Run workflow
name: web-apps images

on:
  push:
    branches: [main]
    paths:
      - "web-apps/**"
      - ".github/workflows/web-apps-images.yml"
  pull_request:
    paths:
      - "web-apps/**"
      - ".github/workflows/web-apps-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io with the built-in GITHUB_TOKEN (no registry secrets)

concurrency:
  group: web-apps-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Next.js 16's `next build` no longer lints, so lint is its own job.
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-apps
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from web-apps/package.json "packageManager"
        with:
          package_json_file: web-apps/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-apps/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  image:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one app failing doesn't cancel the others
      matrix:
        app: [web-portal, survey-app, web-portal-starter, data-portal]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: web-apps
          build-args: APP=${{ matrix.app }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-app layer cache (pnpm fetch layer is reused until the lockfile changes)
          cache-from: type=gha,scope=web-apps-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=web-apps-${{ matrix.app }}
