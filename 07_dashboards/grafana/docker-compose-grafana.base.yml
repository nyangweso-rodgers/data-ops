# 07_dashboards/grafana/docker-compose-grafana.base.yml
# Base Grafana observability stack - shared across all environments
# (Grafana + Prometheus + Loki + Postgres exporter)
#
# This file also works on its own (the root docker-compose.yml extends it).
#
# Usage:
#   Dev:  make grafana-dev-up   (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-grafana.base.yml -f docker-compose-grafana.dev.yml up -d)
#   Prod: make grafana-prod-up  (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-grafana.base.yml -f docker-compose-grafana.prod.yml up -d)

services:
  # ============================================================================
  # GRAFANA - Dashboards (plugins + provisioning baked into the image, see Dockerfile)
  # ============================================================================
  grafana:
    build:
      context: .
      dockerfile: Dockerfile
    image: grafana-custom
    container_name: grafana
    ports:
      - "${GRAFANA_HOST_PORT:?see ports.env}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-vol:/var/lib/grafana
    networks:
      - data-ops-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # PROMETHEUS - Metrics
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:?see ports.env}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ../../monitoring-and-observability/02-prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-vol:/prometheus
    networks:
      - data-ops-network

  # ============================================================================
  # LOKI - Logs
  # ============================================================================
  loki:
    image: grafana/loki:2.9.14
    container_name: loki
    ports:
      - "${LOKI_HOST_PORT:?see ports.env}:3100"
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
    volumes:
      - ../../monitoring-and-observability/03-loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki-vol:/loki
    networks:
      - data-ops-network

  # ============================================================================
  # POSTGRES EXPORTER - Postgres metrics for Prometheus
  # ============================================================================
  postgres-db-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-db-exporter
    ports:
      - "${POSTGRES_EXPORTER_HOST_PORT:?see ports.env}:9187"
    environment:
      # Target DB is overridden in prod.yml.
      # Note: Can't use depends_on across compose files - postgres lives in 01-databases/
      DATA_SOURCE_NAME: "postgresql://${LOCAL_PG_DB_USER}:${LOCAL_PG_DB_PASSWORD}@${LOCAL_PG_DB_HOST:-postgres}:${LOCAL_PG_DB_PORT:-5432}/postgres?sslmode=disable"
    networks:
      - data-ops-network

# ============================================================================
# Networks
# ============================================================================
networks:
  data-ops-network:
    external: true

# ============================================================================
# Volumes
# ============================================================================
# Pinned names so the same volumes are used whether the stack is started from
# here (project "grafana") or from the root docker-compose.yml
volumes:
  grafana-vol:
    name: grafana-vol
  prometheus-vol:
    name: prometheus-vol
  loki-vol:
    name: loki-vol
