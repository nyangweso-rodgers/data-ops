# 07_dashboards/03_redash/docker-compose-redash.base.yml
# Base Redash configuration - shared across all environments
#
# Uses the shared postgres/redis services from the root stack instead of spinning
# up dedicated ones (mirrors the pattern used by 01_superset and 04_metabase).
#   - Postgres: dedicated `local_redash` database (created via
#     01-databases/01-postgres/init-scripts/init-redash-db.sql). Redash does NOT
#     create the database itself, and unlike Superset/Metabase it also does not
#     run its schema migrations automatically on boot -- run `make redash-init-db`
#     once after the first `make redash-dev-up` (see Makefile / Readme.md).
#   - Redis: dedicated logical DB (2) to avoid colliding with Superset's cache
#     (DB 1) on the same shared redis instance.
#
# This file also works on its own (the root docker-compose.yml extends it and
# adds the cross-file depends_on on postgres/redis).
#
# Usage:
#   Dev:  make redash-dev-up   (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-redash.base.yml -f docker-compose-redash.dev.yml up -d)
#   Prod: make redash-prod-up  (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-redash.base.yml -f docker-compose-redash.prod.yml up -d)

x-redash-common: &redash-common
  image: redash/redash:10.1.0.b50633
  env_file:
    - ../../.env
  environment:
    PYTHONUNBUFFERED: 0
    REDASH_LOG_LEVEL: INFO
    REDASH_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    REDASH_DATABASE_URL: postgresql://${LOCAL_POSTGRES_REDASH_DB_USER}:${LOCAL_POSTGRES_REDASH_DB_PASSWORD}@${LOCAL_POSTGRES_REDASH_DB_HOST}:5432/${LOCAL_POSTGRES_REDASH_DB_NAME}
    REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
    REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
    REDASH_WEB_WORKERS: 2
  networks:
    - data-ops-network

services:
  redash-server:
    <<: *redash-common
    container_name: redash-server
    command: server
    ports:
      - "${REDASH_HOST_PORT:?see ports.env}:5000"

  redash-scheduler:
    <<: *redash-common
    container_name: redash-scheduler
    command: scheduler

  redash-worker:
    <<: *redash-common
    container_name: redash-worker
    command: worker

# ============================================================================
# Networks
# ============================================================================
networks:
  data-ops-network:
    external: true
