# 07_dashboards/01_superset/docker-compose-superset.dev.yml
# Development override
#
# Prerequisites:
#   - Postgres ($LOCAL_POSTGRES_SUPERSET_DB_HOST) and redis running
#   - Network must exist: docker network create data-ops-network
#
# Usage:
#   make superset-dev-up
#   (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-superset.base.yml -f docker-compose-superset.dev.yml up -d)

services:
  apache-superset:
    environment:
      ENVIRONMENT: dev
    volumes:
      # Development: mount config + provisioning so edits apply on restart without a rebuild
      - ./configs/superset_config.py:/app/pythonpath/superset_config.py
      - ./provisioning:/app/provisioning
    # Note: Can't use depends_on across compose files
    restart: "no" # No auto-restart for easier debugging
