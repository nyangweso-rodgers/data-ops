services:
  metabase:
    # Pinned to the latest STABLE release for reproducible deploys.
    image: metabase/metabase:v0.61.3.5
    container_name: metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3000:3000
    environment:
      # --- Application DB (Postgres) ---
      # Stores Metabase's own config/metadata. Metabase runs its Liquibase
      # migrations into this DB on first boot; the DB itself must already exist
      # (created via 01-databases/01-postgres/init-scripts/init-metabase-db.sql).
      MB_DB_TYPE: ${MB_DB_TYPE}
      MB_DB_DBNAME: ${LOCAL_POSTGRES_METABASE_DB_NAME}
      MB_DB_PORT: 5432
      MB_DB_USER: ${LOCAL_POSTGRES_METABASE_DB_USER}
      MB_DB_PASS: ${LOCAL_POSTGRES_METABASE_DB_PASSWORD}
      MB_DB_HOST: ${LOCAL_POSTGRES_METABASE_DB_HOST}

      # --- First-run admin / setup ---
      # NOTE: Metabase does NOT support seeding the admin or skipping the wizard
      # via env vars. Complete first-run setup at http://localhost:3000 (web
      # wizard) or programmatically via `POST /api/setup` using the setup-token
      # from `GET /api/session/properties`.

      # --- Site config ---
      MB_SITE_NAME: "Your Company Analytics"
      MB_SITE_URL: ${MB_SITE_URL}

      # Skip the bundled H2 "Sample Database" + sample dashboards/collections.
      # Only takes effect on a FRESH instance (empty app DB); ignored once setup
      # is complete. Connect real sources via `make metabase-provision` instead.
      MB_LOAD_SAMPLE_CONTENT: "false"

      # --- Email/SMTP (DISABLED) ---
      # Leaving MB_EMAIL_SMTP_HOST unset disables outgoing email, so Metabase
      # won't attempt (and fail) to send login/alert/report messages.
      # To ENABLE later, set ALL of the following — and note SMTP_HOST must be a
      # real server hostname (e.g. smtp.gmail.com), NOT an email address:
      #   MB_EMAIL_SMTP_HOST: smtp.gmail.com
      #   MB_EMAIL_SMTP_PORT: 587
      #   MB_EMAIL_SMTP_SECURITY: starttls
      #   MB_EMAIL_SMTP_USERNAME: ${SMTP_USER}
      #   MB_EMAIL_SMTP_PASSWORD: ${SMTP_PASS}   # Gmail requires an App Password
      #   MB_EMAIL_FROM_ADDRESS: ${SMTP_USER}

      # --- Query result caching (cost control: Layer B) ---
      # OSS supports only the GLOBAL "adaptive" cache. Cached results are stored
      # in Metabase's own Postgres, so repeat dashboard loads are served from
      # cache instead of re-hitting the warehouse (e.g. ClickHouse Cloud).
      # This flag only ENABLES caching; the adaptive parameters (multiplier /
      # min-duration) live in the root cache policy, applied idempotently by
      # `make metabase-provision` (see provisioning/databases.json -> global_cache).
      # NOTE: in 0.50+ the old MB_QUERY_CACHING_MIN_TTL / _TTL_RATIO env vars are
      # ignored — caching params moved to the /api/cache policy model.
      MB_ENABLE_QUERY_CACHING: "true"

      # --- Performance ---
      MB_JETTY_MAXTHREADS: 50
      MB_ASYNC_QUERY_THREAD_POOL_SIZE: 10
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - data-ops-network
################################ Networks ############################################
networks:
  data-ops-network:
    external: true

################################ Volumes ############################################
