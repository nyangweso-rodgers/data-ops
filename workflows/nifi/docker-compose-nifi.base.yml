# 05_data_pipeline/nifi/docker-compose-nifi.base.yml
# Base Apache NiFi configuration - shared across all environments
#
# Not part of the root docker-compose.yml - run it through its own Makefile.
#
# Usage:
#   Dev:  make nifi-dev-up   (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-nifi.base.yml -f docker-compose-nifi.dev.yml up -d)
#   Prod: make nifi-prod-up  (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-nifi.base.yml -f docker-compose-nifi.prod.yml up -d)

services:
  nifi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nifi
    ports:
      - "${NIFI_HOST_PORT:?see ports.env}:8443"
    environment:
      NIFI_WEB_HTTP_PORT: 8443 # NB: NiFi 2.x is HTTPS-only - see docs/architecture.md
      NIFI_JVM_HEAP_MAX: ${NIFI_JVM_HEAP_MAX:-2g} # Adjust based on your needs
    volumes:
      - nifi-vol:/opt/nifi/nifi-current/conf
      - nifi-flows:/opt/nifi/nifi-current/flows
    networks:
      - data-ops-network

# ============================================================================
# Networks
# ============================================================================
networks:
  data-ops-network:
    external: true

# ============================================================================
# Volumes
# ============================================================================
volumes:
  nifi-vol:
    name: nifi-vol
  nifi-flows:
    name: nifi-flows
