# workflows/dagster/docker-compose-dagster.dev.yml
# Development override
#
# Prerequisites:
#   - Dagster metadata Postgres reachable at DAGSTER_PG_DB_HOST (local container or RDS -
#     switch by changing DAGSTER_PG_DB_* in the root .env, no other change needed)
#   - Network must exist (data-ops-network)
#
# Usage:
#   make dev-up
#   docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-dagster.base.yml -f docker-compose-dagster.dev.yml up -d
services:
  dagster:
    env_file:
      - ../../.env  # Load all variables from root .env
    environment:
      - ENVIRONMENT=dev
      - DAGSTER_LOG_LEVEL=DEBUG
      # Dagster metadata DB - local postgres container or RDS, per DAGSTER_PG_DB_* in .env
      - DAGSTER_POSTGRES_HOST=${DAGSTER_PG_DB_HOST}
      - DAGSTER_POSTGRES_USER=${DAGSTER_PG_DB_USER}
      - DAGSTER_POSTGRES_PASSWORD=${DAGSTER_PG_DB_PASSWORD}
      - DAGSTER_POSTGRES_DB=${DAGSTER_PG_DB_NAME}
      - DAGSTER_POSTGRES_PORT=${DAGSTER_PG_DB_PORT:-5432}
    # Note: Can't use depends_on with health check across compose files
    restart: "no"  # No auto-restart for easier debugging
    volumes:
      # Development: mount code for hot reload
      - ./dagster_pipeline:/app/dagster_pipeline

  dagster_webserver:
    env_file:
      - ../../.env  # Load all variables from root .env
    environment:
      - ENVIRONMENT=dev
      - DAGSTER_LOG_LEVEL=DEBUG
      - DAGSTER_POSTGRES_HOST=${DAGSTER_PG_DB_HOST}
      - DAGSTER_POSTGRES_USER=${DAGSTER_PG_DB_USER}
      - DAGSTER_POSTGRES_PASSWORD=${DAGSTER_PG_DB_PASSWORD}
      - DAGSTER_POSTGRES_DB=${DAGSTER_PG_DB_NAME}
      - DAGSTER_POSTGRES_PORT=${DAGSTER_PG_DB_PORT:-5432}
    ports:
      - "${DAGSTER_HOST_PORT:?see ports.env}:3004"
    restart: "no"
    depends_on:
      dagster:
        condition: service_healthy

  dagster_daemon:
    env_file:
      - ../../.env  # Load all variables from root .env
    environment:
      - ENVIRONMENT=dev
      - DAGSTER_LOG_LEVEL=DEBUG
      - DAGSTER_POSTGRES_HOST=${DAGSTER_PG_DB_HOST}
      - DAGSTER_POSTGRES_USER=${DAGSTER_PG_DB_USER}
      - DAGSTER_POSTGRES_PASSWORD=${DAGSTER_PG_DB_PASSWORD}
      - DAGSTER_POSTGRES_DB=${DAGSTER_PG_DB_NAME}
      - DAGSTER_POSTGRES_PORT=${DAGSTER_PG_DB_PORT:-5432}
    restart: "no"
    depends_on:
      dagster:
        condition: service_healthy