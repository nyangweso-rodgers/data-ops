# 05_data_pipeline/airbyte/docker-compose-airbyte.base.yml
# Base Airbyte configuration - shared across all environments
# (temporal, server, webapp, worker)
#
# NB: Airbyte 1.x no longer supports docker-compose deployments (abctl / Helm only),
# so this stack is unlikely to work as-is - see docs/architecture.md (AB1).
#
# Not part of the root docker-compose.yml - run it through its own Makefile.
#
# Usage:
#   Dev:  make airbyte-dev-up   (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-airbyte.base.yml -f docker-compose-airbyte.dev.yml up -d)
#   Prod: make airbyte-prod-up  (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-airbyte.base.yml -f docker-compose-airbyte.prod.yml up -d)

services:
  # ============================================================================
  # AIRBYTE TEMPORAL - workflow engine
  # ============================================================================
  airbyte-temporal:
    #image: airbyte/temporal:1.4.1
    image: airbyte/temporal-auto-setup:1.13.0 # https://hub.docker.com/r/airbyte/temporal-auto-setup/tags # Use the official Temporal Auto-Setup image
    container_name: airbyte-temporal
    # Note: Can't use depends_on across compose files - start postgres (01-databases/) first
    ports:
      - "${AIRBYTE_TEMPORAL_HOST_PORT:?see ports.env}:7233"
    environment:
      DB: postgresql
      POSTGRES_DB: ${POSTGRES_USERS_DB}
      POSTGRES_USER: ${LOCAL_PG_DB_USER}
      POSTGRES_PWD: ${LOCAL_PG_DB_PASSWORD}
      POSTGRES_SEEDS: ${LOCAL_PG_DB_HOST:-postgres}
      DB_HOST: ${LOCAL_PG_DB_HOST:-postgres}
      POSTGRES_PORT: 5432 # Ensure this is explicitly set to PostgreSQL's default port
      TEMPORAL_CLI_ADDRESS: "airbyte-temporal:7233"
    networks:
      - data-ops-network

  # ============================================================================
  # AIRBYTE SERVER - API
  # ============================================================================
  airbyte-server:
    image: airbyte/server:1.4.1 # https://hub.docker.com/layers/airbyte/server/1.4.1/images/sha256-0c9a18fee1018fec92aec0e86c74d48c86fc7e7ea20598c10f5a7da02c2e07e4
    container_name: airbyte-server
    depends_on:
      - airbyte-temporal
    ports:
      # - "8081:8081" # defaukt airbyte-server port
      - "${AIRBYTE_SERVER_HOST_PORT:?see ports.env}:8002"
    environment:
      #DATABASE_URL: ${POSTGRES_USERS_DATABASE_URL}
      DATABASE_URL: jdbc:postgresql://${LOCAL_PG_DB_HOST:-postgres}:5432/users
      DATABASE_USER: ${LOCAL_PG_DB_USER}
      DATABASE_PASSWORD: ${LOCAL_PG_DB_PASSWORD}
      TEMPORAL_CLI_ADDRESS: "airbyte-temporal:7233"
      WORKSPACE_ROOT: /workspace
      TEMPORAL_HOST: airbyte-temporal
      TEMPORAL_PORT: 7233
    networks:
      - data-ops-network

  # ============================================================================
  # AIRBYTE WEBAPP - UI
  # ============================================================================
  airbyte-webapp:
    image: airbyte/webapp:1.4.1 # https://hub.docker.com/layers/airbyte/webapp/1.4.1/images/sha256-ee0e16eb85eeaf95fc05222a3129cb16911de13ec4773ccb8a64189712b7c9f3
    container_name: airbyte-webapp
    depends_on:
      - airbyte-server
    ports:
      - "${AIRBYTE_WEBAPP_HOST_PORT:?see ports.env}:80"
    environment:
      INTERNAL_API_HOST: http://airbyte-server:8001
    networks:
      - data-ops-network

  # ============================================================================
  # AIRBYTE WORKER - runs syncs
  # ============================================================================
  airbyte-worker:
    image: airbyte/worker:1.4.1 # https://hub.docker.com/layers/airbyte/worker/1.4.1/images/sha256-89153286a7a23f4e28980b52e750b455a40f1bc439ecdbf0dc1363610725fbcc
    container_name: airbyte-worker
    depends_on:
      - airbyte-server
    environment:
      #CONFIG_DATABASE_URL: ${POSTGRES_USERS_DATABASE_URL}
      DATABASE_URL: jdbc:postgresql://${LOCAL_PG_DB_HOST:-postgres}:5432/users
      CONFIG_DATABASE_USER: ${POSTGRES_USER}
      CONFIG_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_TYPE: local
      # STORAGE_TYPE: "gcs"  # or "s3" # if you're using Google Cloud Storage (GCS) or Amazon S3, set:
      WORKSPACE_ROOT: /workspace
    networks:
      - data-ops-network

# ============================================================================
# Networks
# ============================================================================
networks:
  data-ops-network:
    external: true
