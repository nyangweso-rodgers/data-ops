# Each service extends its stack's *.base.yml. Dependencies on services that live
# in another stack's compose file (postgres, redis, neo4j, elasticsearch) are
# declared here, since a base file can't depend_on a service it doesn't define.

x-needs-postgres: &needs-postgres
  postgres:
    condition: service_healthy

x-needs-postgres-redis: &needs-postgres-redis
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # ============================================================================
  # PostgreSQL Services
  # ============================================================================
  postgres:
    extends:
      file: 01-databases/01-postgres/docker-compose-postgres.base.yml
      service: postgres

  # ============================================================================
  # MySQL Services
  # ============================================================================
  mysql:
    extends:
      file: 01-databases/mysql/docker-compose-mysql.base.yml
      service: mysql

  # ============================================================================
  # Dashboard - Metabase
  # ============================================================================
  metabase:
    extends:
      file: 07_dashboards/04_metabase/docker-compose-metabase.base.yml
      service: metabase
    depends_on: *needs-postgres

  # ============================================================================
  # Dashboard - Superset
  # ============================================================================
  apache-superset:
    extends:
      file: 07_dashboards/01_superset/docker-compose-superset.base.yml
      service: apache-superset
    depends_on: *needs-postgres-redis

  # ============================================================================
  # Dashboard - Redash
  # ============================================================================
  redash-server:
    extends:
      file: 07_dashboards/03_redash/docker-compose-redash.base.yml
      service: redash-server
    depends_on: *needs-postgres-redis

  redash-scheduler:
    extends:
      file: 07_dashboards/03_redash/docker-compose-redash.base.yml
      service: redash-scheduler
    depends_on: *needs-postgres-redis

  redash-worker:
    extends:
      file: 07_dashboards/03_redash/docker-compose-redash.base.yml
      service: redash-worker
    depends_on: *needs-postgres-redis

  # ============================================================================
  # Redis Services
  # ============================================================================
  redis:
    extends:
      file: 01-databases/redis/docker-compose-redis.base.yml
      service: redis

  redisinsight:
    extends:
      file: 01-databases/redis/docker-compose-redis.base.yml
      service: redisinsight

  # ============================================================================
  # Elasticsearch Services
  # ============================================================================
  elasticsearch:
    extends:
      file: 01-databases/elasticsearch/docker-compose-elasticsearch.base.yml
      service: elasticsearch

  # ============================================================================
  # Kibana Services
  # ============================================================================
  kibana:
    extends:
      file: 01-databases/elasticsearch/docker-compose-elasticsearch.base.yml
      service: kibana

  # ============================================================================
  # neo4j Services
  # ============================================================================
  neo4j:
    extends:
      file: 01-databases/neo4j/docker-compose-neo4j.base.yml
      service: neo4j

  # ============================================================================
  # Kafka Services
  # ============================================================================
  kafka-zookeeper:
    extends:
      file: 03_messaging_services/kafka/docker-compose-kafka.base.yml
      service: kafka-zookeeper

  kafka:
    extends:
      file: 03_messaging_services/kafka/docker-compose-kafka.base.yml
      service: kafka

  kafka-ui:
    extends:
      file: 03_messaging_services/kafka/docker-compose-kafka.base.yml
      service: kafka-ui

  # ============================================================================
  # Airflow Services
  # ============================================================================
  airflow-webserver:
    extends:
      file: workflows/airflow/docker-compose-airflow.base.yml
      service: airflow-webserver

  airflow-scheduler:
    extends:
      file: workflows/airflow/docker-compose-airflow.base.yml
      service: airflow-scheduler

  # ============================================================================
  # DAGSTER Services
  # ============================================================================
  dagster:
    extends:
      file: workflows/dagster/docker-compose-dagster.base.yml
      service: dagster

  dagster_webserver:
    extends:
      file: workflows/dagster/docker-compose-dagster.base.yml
      service: dagster_webserver

  dagster_daemon:
    extends:
      file: workflows/dagster/docker-compose-dagster.base.yml
      service: dagster_daemon

  # ============================================================================
  # n8n Workflow Automation
  # ============================================================================
  n8n:
    extends:
      file: workflows/n8n/docker-compose-n8n.base.yml
      service: n8n
    depends_on:
      - postgres

  # ============================================================================
  # Prefect Services
  # ============================================================================
  prefect-server:
    extends:
      file: workflows/prefect/docker-compose-prefect.base.yml
      service: prefect-server
    depends_on: *needs-postgres-redis

  prefect-services:
    extends:
      file: workflows/prefect/docker-compose-prefect.base.yml
      service: prefect-services
    depends_on: *needs-postgres-redis

  prefect-worker:
    extends:
      file: workflows/prefect/docker-compose-prefect.base.yml
      service: prefect-worker

  # ============================================================================
  # ClickHouse Services
  # ============================================================================
  clickhouse-server:
    extends:
      file: 06_data_warehouse/clickhouse/docker-compose-clickhouse.base.yml
      service: clickhouse-server

  clickhouse-tabix-web-client:
    extends:
      file: 06_data_warehouse/clickhouse/docker-compose-clickhouse.base.yml
      service: clickhouse-tabix-web-client

  # ============================================================================
  # Amundsen Services
  # ============================================================================
  amundsen-metadata:
    extends:
      file: metadata/amundsen/docker-compose-amundsen.base.yml
      service: amundsen-metadata
    depends_on:
      neo4j:
        condition: service_healthy

  amundsen-search:
    extends:
      file: metadata/amundsen/docker-compose-amundsen.base.yml
      service: amundsen-search
    depends_on:
      elasticsearch:
        condition: service_healthy

  amundsen-frontend:
    extends:
      file: metadata/amundsen/docker-compose-amundsen.base.yml
      service: amundsen-frontend

  # ============================================================================
  # Open Metadata Services
  # ============================================================================
  open-metadata-server:
    extends:
      file: metadata/open-metadata/docker-compose-open-metadata.base.yml
      service: open-metadata-server
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  open-metadata-execute-migrate-all:
    extends:
      file: metadata/open-metadata/docker-compose-open-metadata.base.yml
      service: open-metadata-execute-migrate-all
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # ============================================================================
  # Grafana Services
  # ============================================================================
  grafana:
    extends:
      file: 07_dashboards/grafana/docker-compose-grafana.base.yml
      service: grafana

  # ============================================================================
  # Taipy Services
  # ============================================================================
  taipy:
    extends:
      file: 07_dashboards/taipy/sales-dashboard/docker-compose.taipy.yml
      service: taipy

  # ============================================================================
  # Prometheius Services
  # ============================================================================
  prometheus:
    extends:
      file: 07_dashboards/grafana/docker-compose-grafana.base.yml
      service: prometheus

  # ============================================================================
  # Loki Services
  # ============================================================================
  loki:
    extends:
      file: 07_dashboards/grafana/docker-compose-grafana.base.yml
      service: loki
  postgres-db-exporter:
    extends:
      file: 07_dashboards/grafana/docker-compose-grafana.base.yml
      service: postgres-db-exporter

  # ============================================================================
  # Docusaurus Services
  # ============================================================================
  docusaurus:
    extends:
      file: 10_documentation/docusaurus-site/docker-compose-docusaurus.base.yml
      service: docusaurus

  # ============================================================================
  # ML Flow Services
  # ============================================================================
  ml-flow:
    extends:
      file: ml-models/ml-flow/docker-compose-ml-flow.base.yml
      service: ml-flow

  # ============================================================================
  # ML  Model  Service - Diabetes Predictor API
  # ============================================================================
  diabetes-predictor-api:
    extends:
      file: ml-models/01_diabetes_predictor/docker-compose-diabetes-predictor-ml-model.yml
      service: diabetes-predictor-api

  # ============================================================================
  # Ollama Services
  # ============================================================================
  ollama:
    extends:
      file: ai/open-webui/docker-compose-open-webui.base.yml
      service: ollama

  # ============================================================================
  # Open WebUI Services
  # ============================================================================
  open-webui:
    extends:
      file: ai/open-webui/docker-compose-open-webui.base.yml
      service: open-webui
    depends_on:
      - postgres

  # ============================================================================
  # Trino Services
  # ============================================================================
  trino:
    extends:
      file: 01-databases/trino/docker-compose-trino.base.yml
      service: trino
    depends_on: *needs-postgres

# ============================================================================
# Volumes
# ============================================================================
volumes:
  # Database Volumes
  postgres-data:
    external: true

  # ============================================================================
  # MySQL Volumes
  # ============================================================================
  mysql-data:
    external: true

  redis-data:
    external: true

  redisinsight-data:
    external: true

  # Elasticsearch Volumes
  elasticsearch_data:
    external: true

  # Neo4j Volumes
  neo4j_data:
    external: true

  # Messaging Volumes
  kafka-zookeeper-data:
    external: true

  kafka-data:
    external: true

  # Datawarehouse Volumes
  clickhouse-server-data:
    external: true

  # Superset Volumes
  superset-volume:
    external: true

  # Grafana Volumes
  grafana-vol:
    external: true

  prometheus-vol:
    external: true

  loki-vol:
    external: true

  # AI Volumes
  ollama-data:
    external: true

  # n8n Volumes
  n8n-data:
    external: true

# ============================================================================
# Networks
# ============================================================================
networks:
  data-ops-network:
    external: true
