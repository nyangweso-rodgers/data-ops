# 06_data_warehouse/clickhouse/docker-compose-clickhouse.base.yml
# Base ClickHouse configuration - shared across all environments
# (clickhouse-server + Tabix web client)
#
# This file also works on its own (the root docker-compose.yml extends it).
#
# Usage:
#   Dev:  make clickhouse-dev-up   (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-clickhouse.base.yml -f docker-compose-clickhouse.dev.yml up -d)
#   Prod: make clickhouse-prod-up  (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-clickhouse.base.yml -f docker-compose-clickhouse.prod.yml up -d)

services:
  # ============================================================================
  # CLICKHOUSE SERVER
  # ============================================================================
  clickhouse-server:
    image: clickhouse/clickhouse-server:24.8.7.41
    container_name: clickhouse-server
    ports:
      - "${CLICKHOUSE_NATIVE_HOST_PORT:?see ports.env}:9000"
      - "${CLICKHOUSE_HTTP_HOST_PORT:?see ports.env}:8123"
      - "${CLICKHOUSE_INTERSERVER_HOST_PORT:?see ports.env}:9009"
      - "${CLICKHOUSE_KEEPER_HOST_PORT:?see ports.env}:9181"
    env_file:
      - ../../.env
    environment:
      CLICKHOUSE_DEFAULT_USER: ${CLICKHOUSE_DEFAULT_USER}
      CLICKHOUSE_DEFAULT_USER_PASSWORD: ${CLICKHOUSE_DEFAULT_USER_PASSWORD}
      CLICKHOUSE_TRANSACTION_USER: ${CLICKHOUSE_TRANSACTION_USER}
      CLICKHOUSE_TRANSACTION_USER_PASSWORD: ${CLICKHOUSE_TRANSACTION_USER_PASSWORD}
    volumes:
      - ./config/config.xml:/etc/clickhouse-server/config.xml
      - ./users/users.xml:/etc/clickhouse-server/users.d/users.xml
      - ./logs:/var/log/clickhouse-server/
      - clickhouse-server-data:/var/lib/clickhouse/
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"] # Simple query to check server responsiveness
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-ops-network

  # ============================================================================
  # TABIX - Web SQL client
  # ============================================================================
  clickhouse-tabix-web-client:
    image: spoonest/clickhouse-tabix-web-client:latest
    container_name: clickhouse-tabix-web-client
    ports:
      - "${TABIX_HOST_PORT:?see ports.env}:80"
    env_file:
      - ../../.env
    environment:
      CH_HOST: clickhouse-server
      CH_PORT: 8123
      CH_USER: ${CLICKHOUSE_DEFAULT_USER} # Optional: Passes default user to Tabix
      CH_PASSWORD: ${CLICKHOUSE_DEFAULT_USER_PASSWORD} # Optional: Passes default password to Tabix
    depends_on:
      - clickhouse-server
    networks:
      - data-ops-network

# ============================================================================
# Networks
# ============================================================================
networks:
  data-ops-network:
    external: true

# ============================================================================
# Volumes
# ============================================================================
volumes:
  clickhouse-server-data:
    name: clickhouse-server-data
