# 03_streaming/kafka/docker-compose-kafka.base.yml
# Base Kafka configuration - shared across all environments
# (KRaft broker - no ZooKeeper, schema registry, kafka-ui, cp-kafka-connect, debezium connect)
# Architecture: docs/architecture.md
#
# This file also works on its own (the root docker-compose.yml extends it).
#
# Usage:
#   Dev:  make kafka-dev-up   (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-kafka.base.yml -f docker-compose-kafka.dev.yml up -d)
#   Prod: make kafka-prod-up  (= docker-compose --env-file ../../.env --env-file ../../ports.env -f docker-compose-kafka.base.yml -f docker-compose-kafka.prod.yml up -d)

services:
  ################################ 1 Apache Kafka (KRaft) ############################################
  #
  # Single node in combined mode: the broker is also its own KRaft controller, so there
  # is no ZooKeeper (Kafka 4.0 removed ZooKeeper support entirely).
  kafka:
    image: confluentinc/cp-kafka:7.6.1 # official image - no custom build needed
    container_name: kafka
    ports:
      # "`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-
      # An important note about accessing Kafka from clients on other machines:
      # -----------------------------------------------------------------------
      #
      # The config used here exposes port 9092 for _external_ connections to the broker
      # i.e. those from _outside_ the docker network. This could be from the host machine
      # running docker, or maybe further afield if you've got a more complicated setup.
      # If the latter is true, you will need to change the value 'localhost' in
      # KAFKA_ADVERTISED_LISTENERS to one that is resolvable to the docker host from those
      # remote clients (prod.yml does this via KAFKA_ADVERTISED_HOST)
      #
      # For connections _internal_ to the docker network, such as from other services
      # and components, use kafka:29092.
      #
      # See https://rmoff.net/2018/08/02/kafka-listeners-explained/ for details
      # "`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-
      #
      - "${KAFKA_INTERNAL_HOST_PORT:?see ports.env}:29092"
      - "${KAFKA_HOST_PORT:?see ports.env}:9092"
      #- "9101:9101"
    environment:
      # --- KRaft ---------------------------------------------------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093 # <node id>@<host>:<CONTROLLER port>
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Formats the log dir on first start. Fixed so the cluster keeps its identity across
      # recreates; a new ID needs a fresh kafka-data volume.
      CLUSTER_ID: 078qCeQ1QKSd6Ce9evEXbw
      # ---------------------------------------------------------------------------
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1" # single broker - raise only with more brokers
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # An important note about KAFKA_LISTENERS and KAFKA_ADVERTISED_LISTENERS
      # ---------------------------------------------------------------------
      # The KAFKA_LISTENERS setting defines where Kafka will listen for connections
      # The KAFKA_ADVERTISED_LISTENERS setting tells clients how to connect to the Kafka broker

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:?see ports.env} # must equal the published host port

      #KAFKA_LISTENERS: PLAINTEXT://kafka:29092, PLAINTEXT_HOST://0.0.0.0:9092
      #KAFKA_LISTENERS: PLAINTEXT://kafka:29092, PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:?see ports.env} # must equal the published host port
      # PLAINTEXT = inside the docker network, PLAINTEXT_HOST = from the host,
      # CONTROLLER = KRaft quorum traffic (not advertised to clients, not published)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      #KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      #KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      #KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      #KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2

      #KAFKA_JMX_PORT: 9092
      KAFKA_JMX_HOSTNAME: localhost

      #KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      #KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1

      #KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      #KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: "true"
      CONFLUENT_SUPPORT_CUSTOMER_ID: "anonymous"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - data-ops-network

  ################################ 3 Kafka UI ############################################
  #
  kafka-ui:
    # kafbat = the maintained continuation of provectuslabs/kafka-ui (abandoned since 2024),
    # same KAFKA_CLUSTERS_* config. Releases: https://github.com/kafbat/kafka-ui/releases
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_HOST_PORT:?see ports.env}:8080"
    depends_on:
      - kafka
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMA_REGISTRY: http://kafka-schema-registry:8081
      # Connector management for both Connect clusters (replaces the discontinued debezium-ui)
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: cp-kafka-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://cp-kafka-connect:8083
      KAFKA_CLUSTERS_0_KAFKACONNECT_1_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_1_ADDRESS: http://debezium-connect:8083
    #volumes:
    #- ~/kui/config.yml:/etc/kafkaui/dynamic_config.yaml
    networks:
      - data-ops-network

  ################################ 4 Schema Registry ############################################
  #
  kafka-schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: kafka-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_SCHEMA_REGISTRY_HOST_PORT:?see ports.env}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: kafka-schema-registry

      #SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9101
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092

      #SCHEMA_REGISTRY_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9101

      #SCHEMA_REGISTRY_LISTENERS: http://schema-registry:8081
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_DEBUG: "false" # dev.yml turns this on
    healthcheck:
      start_period: 10s
      interval: 10s
      retries: 20
      test: curl --user superUser:superUser --fail --silent --insecure http://localhost:8081/subjects --output /dev/null || exit 1
    networks:
      - data-ops-network

  ################################ 5 cp-kafka-connect ############################################
  #
  cp-kafka-connect: #https://hub.docker.com/r/confluentinc/cp-kafka-connect/tags
    #image: confluentinc/cp-kafka-connect:7.7.0
    build: ./connectors/cp-kafka-connect
    image: cp-kafka-connect
    container_name: cp-kafka-connect
    ports:
      - "${KAFKA_CONNECT_HOST_PORT:?see ports.env}:8083"
    # Note: Can't use depends_on across compose files - start postgres (01-databases/) first
    depends_on:
      - kafka
      - kafka-schema-registry
    environment:
      # About CONNECT_BOOTSTRAP_SERVERS
      # -------------------------------
      # CONNECT_BOOTSTRAP_SERVERS informs cp-kafka-connect about the location of the Kafka broker it should connect to.
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: "cp-kafka-connect"
      CONNECT_GROUP_ID: "cp-kafka-connect-group"
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000

      # config.storage.topic
      #   The name of the Kafka topic where connector configurations are stored
      CONNECT_CONFIG_STORAGE_TOPIC: _cp-kafka-connect-config-storage
      CONNECT_OFFSET_STORAGE_TOPIC: _cp-kafka-connect-offset-storage
      CONNECT_STATUS_STORAGE_TOPIC: _cp-kafka-connect-status-storage

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      #CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      #CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8085"
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: "http://kafka-schema-registry:8081"
      #CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"

      ########## Value Converters ##########
      #CONNECT_VALUE_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://kafka-schema-registry:8081"
      #CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"

      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"

      ########## Secrets for connector configs ##########
      # Connector JSON references ${env:PG_SOURCE_USER} / ${env:PG_SOURCE_PASSWORD}; the
      # worker resolves them from its own environment, so no credentials live in git.
      # (Not CONNECT_-prefixed on purpose - the image turns CONNECT_* into worker settings.)
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      PG_SOURCE_USER: ${LOCAL_USERS_PG_DB_USER}
      PG_SOURCE_PASSWORD: ${LOCAL_USERS_PG_DB_PASSWORD}

      ########## SSL Configurations ##########
      ########## Additional Configurations ##########
      ########## Metric Reporter Configurations ##########
    #volumes:
      #- ./cp-kafka-connect/connectors:/usr/share/confluent-hub-components
      #- ./cp-kafka-connect/config:/etc/kafka-connect
      #- ./cp-kafka-connect/postgresql-42.2.23.jar:/usr/share/java/postgresql-42.2.23.jar
    networks:
      - data-ops-network

  ################################ 3.7 ksql-db server ############################################
  #
  #ksqldb-server:
  #image: confluentinc/cp-ksqldb-server:latest
  #image: confluentinc/cp-ksqldb-server:7.5.3
  #hostname: ksqldb-server
  #container_name: ksqldb-server
  #depends_on:
  #- kafka
  #- schema-registry
  #ports:
  #- "8088:8088"
  #environment:
  #KSQL_CONFIG_DIR: "/etc/ksqldb"
  #KSQL_LISTENERS: http://0.0.0.0:8088
  #KSQL_BOOTSTRAP_SERVERS: kafka:29092
  #KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
  #KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
  #KSQL_KSQL_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  #KSQL_HOST_NAME: ksqldb-server
  #KSQL_CONNECT_URL: "http://connect:8083"
  #networks:
  #- data-ops-network
  ################################ 3.8 ksql-db-cli ############################################
  #
  #ksqldb-cli:
  #image: confluentinc/cp-ksqldb-cli:6.1.0
  #image: confluentinc/cp-ksqldb-cli:latest # usage -> docker-compose exec ksqldb-cli ksql http://ksqldb-server:8088
  #container_name: ksqldb-cli
  #depends_on:
  #- kafka
  #- debezium
  #- ksqldb-server
