  ################################ 3.5 Debezium Connect ############################################
  #
  debezium-connect:
    # Debezium publishes on quay.io (Docker Hub stopped at 3.0.0, Oct 2024).
    # Releases: https://debezium.io/releases/ - bump to 3.7.x once it has a patch release
    image: quay.io/debezium/connect:3.6.3.Final
    container_name: debezium-connect
    hostname: debezium-connect
    # Note: Can't use depends_on across compose files - start postgres (01-databases/) first
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${DEBEZIUM_CONNECT_HOST_PORT:?see ports.env}:8083" # Connect REST API (image default REST_PORT=8083)
    environment:
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium-connect-config-storage
      STATUS_STORAGE_TOPIC: debezium-connect-status-storage
      OFFSET_STORAGE_TOPIC: debezium-connect-offset-storage
      BOOTSTRAP_SERVERS: kafka:29092
      # 1 = number of brokers in this stack (a higher factor can't be satisfied)
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      #CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      #CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      #KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      #CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema_registry:8081

      #CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      #CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      #VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      #CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema_registry:8081
      ENABLE_DEBEZIUM_SCRIPTING: "true"
      # Secrets for connector configs (see cp-kafka-connect above)
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      PG_SOURCE_USER: ${LOCAL_USERS_PG_DB_USER}
      PG_SOURCE_PASSWORD: ${LOCAL_USERS_PG_DB_PASSWORD}
      PLUGIN_PATH: /kafka/connect/plugins #added as part of the sink connector configuration
      #KAFKA_CONNECT_PLUGINS_DIR: /kafka/connect
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "--fail",
          "-X",
          "GET",
          "http://localhost:8083/connectors",
        ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    #volumes:
    #- ./jar_files:/kafka/connect/avro_jar_files
    networks:
      - data-ops-network

  # Debezium UI was discontinued upstream (last image Dec 2023, Debezium 2.x only).
  # Connectors on debezium-connect are managed from kafka-ui instead (KAFKACONNECT_1).

# ============================================================================
# Networks
# ============================================================================
networks:
  data-ops-network:
    external: true

# ============================================================================
# Volumes
# ============================================================================
volumes:
  kafka-data:
    name: kafka-data
